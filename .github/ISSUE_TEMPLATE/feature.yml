name: Feature request
description: An idea for nanodev, create-nanodev or the plugin.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or workflow, in your words.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: The command, option, skill or behaviour you have in mind.
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
