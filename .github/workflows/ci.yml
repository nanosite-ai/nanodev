name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: build + test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: git identity for the integration test
        run: |
          git config --global user.name "nanodev ci"
          git config --global user.email "ci@nanodev.invalid"
      # npm 10 (bundled with Node 22) crashes resolving vitest's peer set
      # ("Cannot read properties of null (reading 'edgesOut')"); npm 11 doesn't.
      - run: npm install -g npm@11 --no-audit --no-fund
      # No lockfile, and nothing here needs install scripts: never run them.
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - name: package contents
        run: npm pack --dry-run
